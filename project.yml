name: Chyme
options:
  bundleIdPrefix: com.connor
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: XF783932R2
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Manual

targets:
  Chyme:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources: [App, UI, Shared, Engine, Connect, Alarm, Assets, Sounds]
    info:
      path: Config/Chyme-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Chymee
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [chymee]
        NSAlarmKitUsageDescription: "Chyme schedules your alarms and timers so they ring reliably and stop on their own."
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
    dependencies:
      - target: ChymeWidgets
        embed: true
      - target: ChymeWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chyme
        PROVISIONING_PROFILE_SPECIFIER: Chyme CI
        CODE_SIGN_IDENTITY: Apple Distribution

  ChymeWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared, Alarm]
    info:
      path: Config/ChymeWidgets-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Chymee
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chyme.widgets
        PROVISIONING_PROFILE_SPECIFIER: Chyme Widgets CI
        CODE_SIGN_IDENTITY: Apple Distribution

  ChymeWatch:
    type: application
    platform: watchOS
    sources: [Watch, UI, Shared, Connect, WatchAssets, Sounds]
    info:
      path: Config/ChymeWatch-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Chymee
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [chymee]
        WKCompanionAppBundleIdentifier: com.connor.chyme
        WKRunsIndependentlyOfCompanionApp: true
    dependencies:
      - target: ChymeWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chyme.watchkitapp
        PROVISIONING_PROFILE_SPECIFIER: Chyme Watch CI
        CODE_SIGN_IDENTITY: Apple Distribution

  ChymeWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [WatchWidgets, Shared]
    info:
      path: Config/ChymeWatchWidgets-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Chymee
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connor.chyme.watchkitapp.widgets
        PROVISIONING_PROFILE_SPECIFIER: Chyme Watch Widgets CI
        CODE_SIGN_IDENTITY: Apple Distribution
