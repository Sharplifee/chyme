name: Chyme TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main, codex/native-ui-watch]

jobs:
  build:
    runs-on: macos-26
    env:
      APP_BUNDLE: com.connor.chyme
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify core behavior
        run: swiftc Shared/ChymeModels.swift Shared/StopwatchState.swift Tests/main.swift -o /tmp/clock-tests && /tmp/clock-tests

      - name: Generate project
        run: xcodegen generate

      - name: Capture native simulator screens
        run: python3 scripts/capture_simulators.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chymee-native-UI-review
          path: qa-screenshots/

      - name: Import signing certificate
        env:
          P12: ${{ secrets.APPLE_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DIST_P12_PASSWORD }}
        run: |
          set -e
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # WWDR intermediate: without it a valid leaf reports "certificate is invalid"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o $RUNNER_TEMP/wwdr.cer
          security import $RUNNER_TEMP/wwdr.cer -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security || true
          echo "$P12" | base64 -d > $RUNNER_TEMP/dist.p12
          security import $RUNNER_TEMP/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profiles
        env:
          PROFILE_APP: ${{ secrets.PROFILE_APP }}
          PROFILE_WIDGETS: ${{ secrets.PROFILE_WIDGETS }}
          PROFILE_WATCH: ${{ secrets.PROFILE_WATCH }}
          PROFILE_WATCH_WIDGETS: ${{ secrets.PROFILE_WATCH_WIDGETS }}
          AH_APP: ${{ secrets.AH_APP }}
          AH_WIDGETS: ${{ secrets.AH_WIDGETS }}
          AH_WATCH: ${{ secrets.AH_WATCH }}
          AH_WATCH_WIDGETS: ${{ secrets.AH_WATCH_WIDGETS }}
        run: |
          set -e
          DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$DIR"
          i=0
          for P in "$PROFILE_APP" "$PROFILE_WIDGETS" "$PROFILE_WATCH" "$PROFILE_WATCH_WIDGETS" "$AH_APP" "$AH_WIDGETS" "$AH_WATCH" "$AH_WATCH_WIDGETS"; do
            i=$((i+1))
            echo "$P" | base64 -d > "$DIR/chyme_$i.mobileprovision"
          done
          ls -la "$DIR"

      - name: Resolve build number
        id: bn
        run: echo "build_number=$(( $(date +%s) / 60 ))" >> $GITHUB_OUTPUT

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project Chyme.xcodeproj \
            -scheme Chyme \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/Chyme.xcarchive \
            CURRENT_PROJECT_VERSION=${{ steps.bn.outputs.build_number }} \
            archive 2>&1 | tee /tmp/archive.log | grep -E "error:|ARCHIVE|Signing" || true
          grep -q "ARCHIVE SUCCEEDED" /tmp/archive.log

      - name: Export IPA
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>XF783932R2</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.connor.chyme</key><string>Chyme CI</string>
              <key>com.connor.chyme.widgets</key><string>Chyme Widgets CI</string>
              <key>com.connor.chyme.watchkitapp</key><string>Chyme Watch CI</string>
              <key>com.connor.chyme.watchkitapp.widgets</key><string>Chyme Watch Widgets CI</string>
            </dict>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Chyme.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist 2>&1 | tee /tmp/export.log | tail -30
          ls -la $RUNNER_TEMP/export

      - name: Export ad hoc IPA (installs without an App Store Connect record)
        run: |
          cat > $RUNNER_TEMP/ExportAdHoc.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>teamID</key><string>XF783932R2</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.connor.chyme</key><string>Chyme AdHoc</string>
              <key>com.connor.chyme.widgets</key><string>Chyme Widgets AdHoc</string>
              <key>com.connor.chyme.watchkitapp</key><string>Chyme Watch AdHoc</string>
              <key>com.connor.chyme.watchkitapp.widgets</key><string>Chyme Watch Widgets AdHoc</string>
            </dict>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Chyme.xcarchive \
            -exportPath $RUNNER_TEMP/adhoc \
            -exportOptionsPlist $RUNNER_TEMP/ExportAdHoc.plist 2>&1 | tail -25
          ls -la $RUNNER_TEMP/adhoc

      - uses: actions/upload-artifact@v4
        with:
          name: Chyme-adhoc-ipa
          path: ${{ runner.temp }}/adhoc/*.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Chyme-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls $RUNNER_TEMP/export/*.ipa | head -1)
          set +e
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee /tmp/upload.log
          set -e
          # altool's exit code is unreliable; trust the log, not the code
          if grep -qi "No errors uploading\|UPLOAD SUCCEEDED" /tmp/upload.log; then
            echo "Upload confirmed"
          else
            echo "TestFlight upload failed"
            exit 1
          fi
